name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments: a newer push waits for the running one instead
# of racing it. The later run still wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Create the Pages site on the first run (build_type = workflow), so a
      # fresh repository does not need the manual Settings -> Pages click.
      # Pull requests from forks get a read-only token, so skip it there.
      - name: Enable / configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board manager
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install \
            "GFX Library for Arduino@1.6.7" \
            "SensorLib@0.4.1" \
            "XPowersLib@0.3.3" \
            "U8g2@2.36.19"

      - name: Check the frozen partition table
        run: |
          python tools/check_layout.py
          diff -u partitions.csv hub/partitions.csv

      - name: Build TamaHub
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=custom" \
            --build-path build/hub hub

      - name: Build TamaPoke
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-path build/TamaPoke games/TamaPoke

      - name: Build TamaDigi
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --build-path build/TamaDigi games/TamaDigi

      - name: Check app sizes against the slots
        run: |
          python tools/check_layout.py \
            --bin factory=build/hub/hub.ino.bin \
            --bin ota_0=build/TamaPoke/TamaPoke.ino.bin \
            --bin ota_1=build/TamaDigi/TamaDigi.ino.bin

      - name: Build the web installer
        run: python tools/make_installer.py

      - name: Verify the installer never writes inside NVS
        run: python tools/check_installer.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
